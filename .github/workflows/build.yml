name: 🔐 Build Security Guard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Create fresh Flutter project
        run: |
          flutter create --org com.nacdev temp_project
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets/images

      - name: 🔧 Fix Kotlin version
        run: |
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.23'/" temp_project/android/build.gradle
          cat temp_project/android/build.gradle

      - name: 🔧 Fix pubspec assets
        run: |
          sed -i '/assets:/,/- assets\/images\//d' temp_project/pubspec.yaml
          echo "" >> temp_project/pubspec.yaml

      - name: 📦 Get packages
        run: |
          cd temp_project
          flutter pub get

      - name: 🔨 Build APK Release
        run: |
          cd temp_project
          flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
