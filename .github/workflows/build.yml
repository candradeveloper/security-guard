name: 🔐 Build Security Guard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: 🏗️ Create fresh Flutter project
        run: |
          flutter create --org com.nacdev temp_project
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          mkdir -p temp_project/assets/images

      - name: 🔧 Fix pubspec assets
        run: |
          sed -i '/- assets\/images\//d' temp_project/pubspec.yaml

      - name: 🔧 Fix app/build.gradle compileSdkVersion
        run: |
          cat > temp_project/android/app/build.gradle << 'GRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.nacdev.temp_project"
              compileSdkVersion 35
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId "com.nacdev.security_guard"
                  minSdkVersion 23
                  targetSdkVersion 35
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }
          GRADLE
          echo "=== app/build.gradle ==="
          cat temp_project/android/app/build.gradle

      - name: 🗑️ Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper

      - name: 📦 Get packages
        run: |
          cd temp_project
          flutter pub get

      - name: 🔨 Build APK Release
        run: |
          cd temp_project
          flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
