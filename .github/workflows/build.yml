name: 🔐 Build Security Guard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manual trigger dari GitHub UI

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required untuk Flutter Android build)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Verifikasi instalasi
      - name: ✅ Flutter doctor
        run: flutter doctor -v

      # 5. Install dependencies
      - name: 📦 Get packages
        run: flutter pub get

      # 6. Analyze kode
      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 7. Run tests (kalau ada)
      - name: 🧪 Run tests
        run: flutter test
        continue-on-error: true

      # 8. Build APK Release
      - name: 🔨 Build APK (Release)
        run: flutter build apk --release --no-shrink

      # 9. Build APK Debug (opsional, untuk testing)
      - name: 🔨 Build APK (Debug)
        run: flutter build apk --debug

      # 10. Upload APK sebagai artifact
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: security-guard-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # 11. Tampilkan info APK
      - name: 📊 APK Info
        run: |
          echo "=== APK Build Selesai! ==="
          ls -lh build/app/outputs/flutter-apk/
          echo ""
          echo "✅ Release APK: build/app/outputs/flutter-apk/app-release.apk"
          echo "✅ Debug APK: build/app/outputs/flutter-apk/app-debug.apk"

  # Job kedua: buat release otomatis kalau push tag
  release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⬇️ Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: security-guard-release-apk
          path: ./apk

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/app-release.apk
          name: "Security Guard ${{ github.ref_name }}"
          body: |
            ## 🔐 Security Guard ${{ github.ref_name }}
            
            ### Fitur:
            - 🔒 PIN Lock 6 digit dengan animasi shake
            - 📸 Intruder Selfie — foto otomatis saat PIN salah
            - 🗄️ Vault terenkripsi (AES-256)
            - 📍 GPS Tracker & Anti-theft log
            
            ### Cara Install:
            1. Download `app-release.apk`
            2. Aktifkan "Install dari sumber tidak dikenal" di HP
            3. Install APK
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
